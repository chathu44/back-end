spring.application.name=backend
server.port=8010
# Database — change these for your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/chathumi_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT — change this secret before sharing with a real deployment
security.jwt.token.secret-key=${JWT_SECRET:student-template-secret-key-change-me}

# Child photo storage
app.upload.child-photo-dir=${user.dir}/uploads/children

# Maximum uploaded photo size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB